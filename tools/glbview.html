<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>U-505 GLB check</title>
<style>
  html, body { margin: 0; height: 100%; background: #9fb3c4; overflow: hidden; font: 13px/1.4 system-ui, sans-serif; }
  #stats { position: fixed; left: 12px; top: 12px; background: rgba(10, 16, 22, .78); color: #e6edf3;
           padding: 10px 12px; border-radius: 6px; white-space: pre; max-width: calc(100vw - 48px); }
</style>
<!-- Same three.js version as the game (index.html), plus its example add-ons. -->
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stats">loading…</div>
<script type="module">
// Standalone check for the Blender export (tools/blender/u505/export_gltf.py).
// Query: ?file=art/u505_exterior.glb (default) or art/u505_exterior_draco.glb; &sea=0 hides the
// waterline plane; &view=bow|stern|side|top|tower|casing|far picks the camera.
// Results are also on window.__glb for console checks.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const q = new URLSearchParams(location.search);
const file = '/' + (q.get('file') || 'art/u505_exterior.glb').replace(/^\/+/, '');
const WL = 4.30;                       // estimated surfaced waterline, metres above the PH bottom
const statsEl = document.getElementById('stats');
const warnings = [];
const origWarn = console.warn;
console.warn = (...a) => { warnings.push(a.join(' ')); origWarn(...a); };

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fb3c4);
scene.fog = new THREE.Fog(0x9fb3c4, 250, 900);
scene.add(new THREE.HemisphereLight(0xcfe0ee, 0x1d2a33, 1.1));
const sun = new THREE.DirectionalLight(0xfff1dd, 2.6);
sun.position.set(60, 45, -40);
scene.add(sun);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 3000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.addEventListener('change', () => renderer.render(scene, camera));

if (q.get('sea') !== '0') {
  const sea = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000),
    new THREE.MeshStandardMaterial({ color: 0x163a52, roughness: 0.25, metalness: 0.0, transparent: true, opacity: 0.88 }));
  sea.rotation.x = -Math.PI / 2;
  sea.position.y = WL;
  sea.name = 'Sea';
  scene.add(sea);
}

const VIEWS = {
  bow:   [[28, 11, -62], [0, 5, -8]],
  stern: [[24, 6, 52], [0, 3, 20]],
  side:  [[95, 8, 0], [0, 5, 0]],
  top:   [[0.01, 120, 0], [0, 0, 0]],
  tower: [[11, 11, -9], [0, 7.5, 1]],
  casing: [[7.5, 7.2, -21], [0, 5.2, -15]],   // close on the starboard casing forward of the tower
  far:   [[330, 22, -90], [0, 5, 0]],         // Act 1 distance: checks mip bleed at atlas seams
};
function setView(name) {
  const [p, t] = VIEWS[name] || VIEWS.bow;
  camera.position.set(...p);
  controls.target.set(...t);
  controls.update();
}

const loader = new GLTFLoader();
const draco = new DRACOLoader();
draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/gltf/');
loader.setDRACOLoader(draco);

const t0 = performance.now();
loader.load(file, (gltf) => {
  const root = gltf.scene;
  scene.add(root);
  root.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  let meshes = 0, prims = 0, tris = 0;
  const materials = new Set();
  root.traverse((o) => {
    if (o.isMesh) {
      prims++;
      materials.add(o.material.name);
      const g = o.geometry;
      tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
    }
  });
  root.children.forEach((c) => { if (c.isMesh || c.isGroup || c.isObject3D) meshes++; });
  const centreZ = (name) => {
    const o = root.getObjectByName(name);
    if (!o) return null;
    const b = new THREE.Box3().setFromObject(o);
    return +b.getCenter(new THREE.Vector3()).z.toFixed(2);
  };
  const r = {
    file, loadMs: Math.round(performance.now() - t0),
    size: size.toArray().map((v) => +v.toFixed(2)),
    min: box.min.toArray().map((v) => +v.toFixed(2)),
    max: box.max.toArray().map((v) => +v.toFixed(2)),
    bowPlanesZ: centreZ('Bow_PlanesGuards'), propellersZ: centreZ('Stern_Propellers'),
    nodes: meshes, primitives: prims, triangles: Math.round(tris),
    materials: [...materials].sort(), warnings,
  };
  setView(q.get('view') || 'bow');
  renderer.render(scene, camera);
  r.drawCalls = renderer.info.render.calls;
  r.programs = renderer.info.programs.length;
  window.__glb = r;
  statsEl.textContent =
    `${file}  (${r.loadMs} ms)\n` +
    `size x/y/z  ${r.size.join(' × ')} m\n` +
    `bow planes z ${r.bowPlanesZ}   propellers z ${r.propellersZ}  (bow should be −Z)\n` +
    `nodes ${r.nodes}   primitives ${r.primitives}   draw calls ${r.drawCalls}\n` +
    `triangles ${r.triangles.toLocaleString()}   programs ${r.programs}\n` +
    `warnings ${warnings.length}`;
}, undefined, (err) => {
  statsEl.textContent = 'load failed: ' + (err && err.message || err);
  window.__glb = { error: String(err && err.message || err) };
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.render(scene, camera);
});
window.__view = (name) => {
  // the pane may have been hidden (zero-sized) at load; re-measure before drawing
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  setView(name);
  renderer.render(scene, camera);
};
</script>
</body>
</html>
